<div id="mini-display-container" class="cms-mini-display-container" tabindex="0" (mouseenter)="setFocusOnMiniDisplayContainer()">
  <div class="cms-mini-display" [ngStyle]="miniDisplayStyle">
    @if (showDisplayContent) {
      <cms-grid
        [miniTiles]="miniDisplayTilerList"
        [tiles]="displayTilerList"
        [contents]="miniDisplayContentList">
      </cms-grid>
    }
  </div>
</div>
