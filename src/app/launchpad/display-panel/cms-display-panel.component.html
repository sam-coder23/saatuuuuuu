<md-toolbar id="display-panel-toolbar" class="toolbar-theme">
    <div class="display-panel-toolbar-row">
        <button id="display-panel-back-button" class="action-button-exit" md-raised-button nd-click-debounce (ndClick)="navigateBack()">
            <md-icon class="material-icons"> arrow_back </md-icon>
            {{'common.exit' | translate}}
        </button>
    </div>
    <span class="fill-remaining-space"></span>

    <cms-display-name></cms-display-name>

    <span class="fill-remaining-space"></span>
</md-toolbar>

<cms-mini-display *ngIf="display" [display]="display" (onZoom)="zoomLevel = $event" [fitHeight]="fitHeightCount">
</cms-mini-display>
