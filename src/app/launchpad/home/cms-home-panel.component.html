<div class="page-toolbar">
      <mat-toolbar class="toolbar-theme">
            <!-- logoff-button -->
            <button class="action-button-exit" mat-raised-button nd-click-debounce (ndClick)="userLogoff()">
                  {{ 'home.logoff' | translate}}
            </button>
            <!-- end -->
            <span class="fill-remaining-space"></span>
            <cms-display-name class="toolbar-text"></cms-display-name>
            <span class="fill-remaining-space"></span>
            <i class="material-icons menu-button" [matMenuTriggerFor]="menu">more_vert</i>
            <mat-menu #menu="matMenu">
                  <!-- setting button -->
                  <button mat-menu-item nd-click-debounce (ndClick)="navigateToSettings()">
                        <mat-icon>settings</mat-icon>
                        <span>{{ 'home.settings' | translate }}</span>
                  </button>
                  <!-- end -->
                  <!-- about button -->
                  <button mat-menu-item nd-click-debounce (ndClick)="navigateToAbout()">
                        <mat-icon>info</mat-icon>
                        <span>{{ 'home.about' | translate }}</span>
                  </button>
                  <!-- end -->
            </mat-menu>
      </mat-toolbar>
</div>

<div class="home-panel-wrapper" *ngIf="showHomePanel">
      <!-- Source Block -->
      <mat-card class="card source-block" nd-click-debounce (ndClick)="navigateToSource()">
            <div class="card-content">
                  <mat-card-title class="card-title">
                        {{ 'home.selectSource' | translate }}
                  </mat-card-title>
                  <i aria-label="Sources" class="material-icons">check_box_outline_blank</i>
            </div>
      </mat-card>
      <!-- end -->
      <!-- Layout Block -->
      <mat-card class="card layout-block" nd-click-debounce (ndClick)="navigateToLayout()" [ngClass]="{disabled: isDisabled}">
            <div class="card-content">
                  <mat-card-title class="card-title">
                        {{ 'home.selectLayout' | translate }}
                  </mat-card-title>
                  <i aria-label="Layout" class="material-icons">dashboard</i>
            </div>
      </mat-card>
      <!-- end -->
      <!-- Reposition Block -->
      <mat-card class="card reposition-block" nd-click-debounce (ndClick)="navigateToResposition()" [ngClass]="{disabled: isDisabled}">
            <div class="card-content">
                  <mat-card-title class="card-title">
                        {{ 'home.repositionSources' | translate }}
                  </mat-card-title>
                  <i aria-label="Sources" class="material-icons">picture_in_picture_alt</i>
            </div>
      </mat-card>
      <!-- end -->
      <!-- popup -->
      <nd-popup *ngIf="showClearWallPopup" class="confirm-popup" title="{{'home.clearWallConfirmationPopupTitle' | translate }}"
            (done)="clearMiniDisplayWall()" (cancelled)="cancelClearWallPopup();" (closing)="closingClearWallPopup();" okText="{{'common.yes' | translate}}"
            cancelText="{{'common.no' | translate}}">
            <popup-body>
                  {{'home.clearWallConfirmationPopupMessage' | translate}}
            </popup-body>
      </nd-popup>
      <!-- end -->
</div>
