<md-toolbar id="dashboard-toolbar" class="toolbar-theme">

    <div class="dashboard-toolbar-row" *ngIf="!isLongPressed">
        <button id="dashboard-options-button" md-icon-button nd-click-debounce (ndClick)="viewOptions = true;">
            <i class="material-icons" aria-label="Options">menu</i>
        </button>
    </div>

    <button id="display-panel-back-button" md-icon-button nd-click-debounce *ngIf="isLongPressed" (ndClick)="backToDisplayPanel()">
        <i class="material-icons">arrow_back</i>
    </button>

    <span class="fill-remaining-space"></span>

    <cms-display-name></cms-display-name>

    <span class="fill-remaining-space"></span>

    <button id="log-off" md-button md-raised-button nd-click-debounce (ndClick)="logoff()">
            {{'common.logout' | translate}}
    </button>
</md-toolbar>

<!-- @pending  We need to add handlers and put some business logic before updating our variables -->
<cms-options *ngIf="viewOptions" (close)="viewOptions = false;" [zoom]="zoomLevel" (fitHeight)="fitHeight()" [isSaveLayoutEnabled]="isSaveLayoutEnabled"></cms-options>

<cms-mini-display *ngIf="display" [display]="display" (onZoom)="zoomLevel = $event" (close)="setFocusOnMiniDisplayContainer()"
    [fitHeight]="fitHeightCount"></cms-mini-display>

<md-toolbar id="bottom-toolbar" class="page-toolbar toolbar-theme bottom">
    <button md-button md-raised-button nd-click-debounce id="display-panel-back-button" (ndClick)="navigateBack()" class="back-button"><md-icon>navigate_before</md-icon></button>

    <span class="fill-remaining-space"></span>

    <button md-button md-raised-button nd-click-debounce id="display-panel-next-button" (ndClick)="logoff()" class="next-button">{{'common.exit' | translate}}</button>
</md-toolbar>

<nd-popup id="display-panel-clear-wall-popup" *ngIf="showClearWallPopup" class="confirm-popup" title="{{'displayPanel.clearWallConfirmationPopupTitle' | translate }}"
    (done)="clearMiniDisplayWall()" (closing)="closingClearWallPopup();" okText="{{'common.yes' | translate}}" cancelText="{{'common.no' | translate}}">
    <popup-body>
        {{'displayPanel.clearWallConfirmationPopupMessage' | translate}}
    </popup-body>
</nd-popup>
