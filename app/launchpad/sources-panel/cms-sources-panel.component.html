<div class="page-toolbar">
    <md-toolbar id="sources-panel-toolbar" class="toolbar-theme">
        <span id="sources-panel-back-button-text">{{ panelTitle }}</span>

        <span class="fill-remaining-space"></span>

        <cms-display-name></cms-display-name>

        <span class="fill-remaining-space"></span>

        <button id="sources-panel-reload-button" md-icon-button *ngIf="mStates.reload" (click)="reloadList()">
            <i class="material-icons">refresh</i>
        </button>
        <button id="sources-panel-favorite-button" md-icon-button nd-click-debounce (ndClick)="setFavourite()">
            <i class="material-icons">{{ isFavoriteFilter ? "star" : "star_border" }}</i>
        </button>
        <button md-icon-button (click)="initializeSearch($event)">
            <i class="material-icons">search</i>
        </button>
        <md-input-container id="sources-panel-search-input">
            <input md-input type="text" placeholder="{{ 'panelToolbar.search' | translate }}" [(ngModel)]="searchKey">
        </md-input-container>

        <button id="log-off" md-button md-raised-button routerLink="/login">
            {{'common.logout' | translate}}
        </button>
    </md-toolbar>
</div>

<div class="sources-panel-main">
    <cms-source-list [tilePresets] = "tilePresets" [displayId]="mDisplayId"  [selectedOnly]="selectedOnly" (change)="onListChanged()" *ngIf="mStates.list" [searchFilter]="searchFilter"
        [favoriteFilter]="isFavoriteFilter" (error)="errorMessage = $event"></cms-source-list>
</div>
<div class="page-toolbar bottom">
    <md-toolbar id="sources-panel-bottom-toolbar" class="toolbar-theme">
        <button id="sources-panel-back-button" md-button md-raised-button nd-click-debounce (ndClick)="navigateBack()" class="back-button">
            <md-icon>navigate_before</md-icon>
        </button>
        <span class="fill-remaining-space"></span>
        <span>
            {{cmsSettingService?.selectedSources?.length}} / {{maxSelection}}
        </span>
        &nbsp;
        <span class="error" *ngIf="errorMessage">
            {{errorMessage}}
        </span>
        <span class="fill-remaining-space"></span>
        <button md-button md-raised-button nd-click-debounce id="sources-panel-next-button" [hidden]="!cmsSettingService?.selectedSources?.length > 0" (ndClick)="navigateNext()" class="next-button">
             <md-icon>navigate_next</md-icon>
        </button>
    </md-toolbar>
</div>
