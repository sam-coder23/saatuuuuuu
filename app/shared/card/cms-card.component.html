<md-card id="card-{{card.id}}" (click)="selectCard(card)" class="card" 
[ngClass]="{disabled: card.disabled}">
      <div class="card-inner layout-row">
            <div class="card-image-section">
                  <img src={{cardSnapshot}} class="card-image" alt="source">
            </div>
            <div class="card-content-section layout-column">
                  <md-card-title id="card-title" class="card-title" [title]="card.name">
                        {{card.name}}
                  </md-card-title>
                  <md-card-content class="card-content" [title]="card.description">
                        <div id="card-description" class="card-desc">
                              <pre>{{card.description}}</pre>
                        </div>
                  </md-card-content>
            </div>
            <div class="card-fav-section layout-column layout-align-space-between">
                  <button id="card-favorite" md-icon-button (click)="markFavorite($event, card)">
                        <i class="material-icons" *ngIf="!isFavorite">star_border</i>
                        <i class="material-icons" *ngIf="isFavorite">star</i>
                  </button>
                  <button id="card-status" *ngIf="card.online != undefined" md-icon-button>
                        <i class="material-icons" *ngIf="card.online">
                              <img src="resources/icons/display_online_black_36.svg">
                        </i>
                        <i class="material-icons" *ngIf="!card.online">
                              <img src="resources/icons/display_offline_black_36.svg">
                        </i>
                  </button>
                  <button id="card-selected" md-icon-button *ngIf="multi">
                        <i class="material-icons">
                              {{card?.selected ? 'check_box' : 'check_box_outline_blank'}}
                        </i>
                  </button>
            </div>
      </div>
</md-card>
